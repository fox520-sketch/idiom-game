<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成語填空小遊戲</title>
  <script src="idioms.js"></script>
  <style>
    :root {
      --bg: #f3f8ef;
      --card: #ffffff;
      --text: #253125;
      --muted: #647064;
      --primary: #4f8a4c;
      --primary-dark: #386b35;
      --border: #d8e8d4;
      --good: #237a35;
      --bad: #b3261e;
      --shadow: 0 12px 28px rgba(35, 70, 35, 0.14);
    }

    body.dark {
      --bg: #050805;
      --card: #111811;
      --text: #f1f7f0;
      --muted: #b9c8b7;
      --primary: #70b66b;
      --primary-dark: #579653;
      --border: #2b3b2b;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }

    body.ink {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #000000;
      --muted: #222222;
      --primary: #000000;
      --primary-dark: #333333;
      --border: #000000;
      --good: #000000;
      --bad: #000000;
      --shadow: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background: radial-gradient(circle at top, #e2f1db 0%, var(--bg) 42%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
    }

    body.dark, body.ink { background: var(--bg); }

    header {
      background: var(--primary);
      color: white;
      padding: 16px 18px;
      text-align: center;
    }

    body.ink header {
      background: white;
      color: black;
      border-bottom: 2px solid black;
    }

    header h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 38px);
      letter-spacing: 0.08em;
    }

    .home-link {
      display: inline-block;
      margin-top: 8px;
      color: inherit;
      text-decoration: underline;
      font-weight: 700;
    }

    main {
      max-width: 920px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .panel, .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 24px;
      padding: 20px;
    }

    .panel {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 700;
    }

    select, input {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 18px;
      background: var(--card);
      color: var(--text);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      text-align: center;
      font-weight: 800;
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .game-card { text-align: center; }

    .question {
      font-size: clamp(42px, 10vw, 76px);
      font-weight: 900;
      letter-spacing: 0.1em;
      margin: 24px 0 18px;
    }

    .answer-row {
      max-width: 240px;
      margin: 0 auto 12px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    button {
      border: none;
      border-radius: 16px;
      background: var(--primary);
      color: white;
      padding: 12px 16px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    body.ink button {
      background: white;
      color: black;
      border: 2px solid black;
    }

    button:hover { background: var(--primary-dark); transform: translateY(-1px); }
    button.secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    body.ink button.secondary { color: black; border-color: black; }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .result {
      min-height: 32px;
      font-size: 22px;
      font-weight: 900;
      margin-top: 16px;
    }

    .meaning, .hint-box {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
      max-width: 680px;
      margin: 8px auto 0;
    }

    .version {
      text-align: center;
      color: var(--muted);
      margin-top: 18px;
      font-size: 14px;
    }

    @media (max-width: 760px) {
      .panel, .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      main { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>成語填空小遊戲</h1>
    <a class="home-link" href="https://fox520-sketch.github.io/fox/">回狐狸之家</a>
  </header>

  <main>
    <section class="panel">
      <div>
        <label for="levelSelect">難度</label>
        <select id="levelSelect"></select>
      </div>
      <div>
        <label for="categorySelect">分類</label>
        <select id="categorySelect"></select>
      </div>
      <div>
        <label for="modeSelect">作答模式</label>
        <select id="modeSelect">
          <option value="choice" selected>四選一</option>
          <option value="input">輸入答案</option>
        </select>
      </div>
      <div>
        <label for="themeSelect">顯示風格</label>
        <select id="themeSelect">
          <option value="nature">自然模式</option>
          <option value="dark">深色模式</option>
          <option value="ink">黑白模式</option>
        </select>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><small>目前題數</small><span id="progress">0 / 0</span></div>
      <div class="stat"><small>分數</small><span id="score">0</span></div>
      <div class="stat"><small>答對</small><span id="correctCount">0</span></div>
      <div class="stat"><small>題庫</small><span id="poolCount">0</span></div>
    </section>

    <section class="game-card">
      <div class="question" id="question">載入中</div>

      <div class="answer-row" id="inputArea">
        <input id="answerInput" maxlength="1" placeholder="輸入缺字" autocomplete="off" />
      </div>

      <div class="choices" id="choiceArea"></div>

      <div class="actions">
        <button id="checkBtn">檢查答案</button>
        <button class="secondary" id="hintBtn">提示</button>
        <button class="secondary" id="nextBtn">下一題</button>
        <button class="secondary" id="restartBtn">重新開始</button>
      </div>

      <div class="result" id="result"></div>
      <div class="hint-box" id="hintBox"></div>
      <div class="meaning" id="meaning"></div>
    </section>

    <div class="version">版本：v2.1｜預設四選一作答｜題庫獨立檔案 idioms.js｜適合 GitHub Pages</div>
  </main>

  <script>
    const state = {
      pool: [],
      order: [],
      current: null,
      index: 0,
      score: 0,
      correct: 0,
      answered: false
    };

    const $ = (id) => document.getElementById(id);

    function uniqueValues(key) {
      return [...new Set(IDIOMS.map(item => item[key]))].sort();
    }

    function fillFilters() {
      const levelSelect = $("levelSelect");
      const categorySelect = $("categorySelect");
      levelSelect.innerHTML = '<option value="全部">全部</option>' + uniqueValues("level").map(v => `<option value="${v}">${v}</option>`).join("");
      categorySelect.innerHTML = '<option value="全部">全部</option>' + uniqueValues("category").map(v => `<option value="${v}">${v}</option>`).join("");
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildPool() {
      const level = $("levelSelect").value;
      const category = $("categorySelect").value;
      state.pool = IDIOMS.filter(item => {
        const levelOK = level === "全部" || item.level === level;
        const categoryOK = category === "全部" || item.category === category;
        return levelOK && categoryOK;
      });
      state.order = shuffle(state.pool);
      state.index = 0;
      state.score = 0;
      state.correct = 0;
      state.answered = false;
      nextQuestion(true);
    }

    function nextQuestion(isReset = false) {
      if (!isReset && !state.answered) {
        $("result").style.color = "var(--bad)";
        $("result").textContent = "請先作答，或按重新開始更換題庫。";
        return;
      }

      if (state.pool.length === 0) {
        $("question").textContent = "沒有題目";
        $("result").textContent = "請更換難度或分類。";
        updateStats();
        return;
      }

      if (state.index >= state.order.length) {
        $("question").textContent = "完成！";
        $("result").style.color = "var(--good)";
        $("result").textContent = `本輪結束，總分 ${state.score}，答對 ${state.correct} 題。`;
        $("meaning").textContent = "按「重新開始」可再玩一次。";
        $("hintBox").textContent = "";
        $("choiceArea").innerHTML = "";
        updateStats();
        return;
      }

      state.current = state.order[state.index];
      state.index += 1;
      state.answered = false;

      $("question").textContent = state.current.blank;
      $("answerInput").value = "";
      $("result").textContent = "";
      $("hintBox").textContent = "";
      $("meaning").textContent = "";
      renderMode();
      updateStats();
      if ($("modeSelect").value === "input") setTimeout(() => $("answerInput").focus(), 0);
    }

    function renderMode() {
      const mode = $("modeSelect").value;
      $("inputArea").style.display = mode === "input" ? "block" : "none";
      $("choiceArea").style.display = mode === "choice" ? "grid" : "none";
      if (mode === "choice") renderChoices();
      else $("choiceArea").innerHTML = "";
    }

    function renderChoices() {
      const wrongAnswers = shuffle([...new Set(IDIOMS.map(i => i.answer).filter(a => a !== state.current.answer))]).slice(0, 3);
      const choices = shuffle([state.current.answer, ...wrongAnswers]);
      $("choiceArea").innerHTML = choices.map(choice => `<button type="button" onclick="chooseAnswer('${choice}')">${choice}</button>`).join("");
    }

    function chooseAnswer(choice) {
      if (state.answered) return;
      $("answerInput").value = choice;
      checkAnswer();
    }

    function checkAnswer() {
      if (!state.current || state.answered) return;
      const value = $("answerInput").value.trim();
      if (!value) {
        $("result").style.color = "var(--bad)";
        $("result").textContent = "請先輸入或選擇答案。";
        return;
      }

      state.answered = true;
      if (value === state.current.answer) {
        state.score += 10;
        state.correct += 1;
        $("result").style.color = "var(--good)";
        $("result").textContent = `答對了！完整成語：${state.current.full}`;
      } else {
        $("result").style.color = "var(--bad)";
        $("result").textContent = `答錯了，正確答案是「${state.current.answer}」。完整成語：${state.current.full}`;
      }
      $("meaning").textContent = `解釋：${state.current.meaning}`;
      updateStats();
    }

    function showHint() {
      if (!state.current) return;
      $("hintBox").textContent = `提示：${state.current.hint}`;
    }

    function updateStats() {
      $("progress").textContent = `${Math.min(state.index, state.order.length)} / ${state.order.length}`;
      $("score").textContent = state.score;
      $("correctCount").textContent = state.correct;
      $("poolCount").textContent = state.pool.length;
    }

    function applyTheme() {
      document.body.className = "";
      const theme = $("themeSelect").value;
      if (theme === "dark") document.body.classList.add("dark");
      if (theme === "ink") document.body.classList.add("ink");
      localStorage.setItem("idiomTheme", theme);
    }

    function loadTheme() {
      const saved = localStorage.getItem("idiomTheme") || "nature";
      $("themeSelect").value = saved;
      applyTheme();
    }

    $("checkBtn").addEventListener("click", checkAnswer);
    $("hintBtn").addEventListener("click", showHint);
    $("nextBtn").addEventListener("click", () => nextQuestion(false));
    $("restartBtn").addEventListener("click", buildPool);
    $("levelSelect").addEventListener("change", buildPool);
    $("categorySelect").addEventListener("change", buildPool);
    $("modeSelect").addEventListener("change", renderMode);
    $("themeSelect").addEventListener("change", applyTheme);
    $("answerInput").addEventListener("keydown", (e) => { if (e.key === "Enter") checkAnswer(); });

    fillFilters();
    loadTheme();
    buildPool();
  </script>
</body>
</html>
